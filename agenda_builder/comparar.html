<!doctype html>
<html lang="pt-PT">
<head>

  <title>Agendas · Mia &amp; Paper</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Jost:wght@300;400;500&family=Montserrat:wght@300;400;500;600&family=Pinyon+Script&family=Playfair+Display:ital,wght@0,400;0,500;1,400&family=Sacramento&family=Parisienne&family=Allura&family=Ephesis&family=Italianno&display=block">

    <label class="interruptor"><input type="checkbox" id="guias"> Guias</label>
    <div class="accoes">

      <button type="button" class="botao principal" id="pdf-imposto">PDF para imprimir</button>

  <main id="livro"></main>
  <div id="impressao"></div>

<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#ffe9f1">
  <title>Mockup 08 · Gelataria | Mia &amp; Paper</title>
  <meta name="description" content="Proposta de homepage Mia & Paper colorida e doce, com pastéis, gradientes e formas arredondadas.">
  <style>
    :root{
      --ink:#4a3b52; --muted:#8a7c93;
      --peach:#ffc7a8; --pink:#ffb3d1; --lilac:#d9c2ff; --mint:#a8ead0; --lemon:#ffe9a8; --sky:#bfe0ff;
      --bg:#fff4f8; --card:#ffffff; --line:rgba(120,90,140,.14);
      --sans:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
      --round:26px;
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth;overflow-x:hidden}
    body{margin:0;color:var(--ink);font-family:var(--sans);line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden;
      background:
        radial-gradient(60% 40% at 15% 0%,rgba(255,179,209,.5),transparent 60%),
        radial-gradient(50% 40% at 100% 10%,rgba(217,194,255,.5),transparent 60%),
        radial-gradient(60% 40% at 50% 100%,rgba(168,234,208,.35),transparent 60%),
        var(--bg);
      background-attachment:fixed}
    body.menu-is-open{overflow:hidden}
    img{display:block;max-width:100%}
    a{color:inherit;text-decoration:none}
    button{font:inherit;color:inherit;cursor:pointer}
    h1,h2,h3,p,blockquote{margin:0}
    .wrap{width:min(100% - 32px,1120px);margin-inline:auto}
    .eyebrow{display:inline-block;font-size:.72rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
      color:#b5567f;background:#fff;padding:7px 14px;border-radius:999px;box-shadow:0 6px 18px -8px rgba(181,86,127,.5)}

    .head{position:sticky;top:0;z-index:40;background:rgba(255,244,248,.8);backdrop-filter:blur(14px);
      display:flex;align-items:center;justify-content:space-between;gap:10px;
      padding:12px max(16px,calc((100% - 1120px)/2))}
    .brand{display:inline-flex;align-items:center;gap:10px;font-weight:800;letter-spacing:-.01em}
    .brand img{width:42px;height:42px;border-radius:50%;object-fit:cover;border:3px solid #fff;box-shadow:0 6px 16px -6px rgba(181,86,127,.6)}
    .head-actions{display:flex;align-items:center;gap:8px}
    .cta-mini{display:inline-flex;align-items:center;min-height:44px;padding:0 18px;border-radius:999px;font-weight:700;
      font-size:.82rem;color:#fff;background:linear-gradient(120deg,var(--pink),var(--lilac))}
    .burger{width:46px;height:46px;border-radius:50%;border:0;background:#fff;display:grid;place-items:center;
      box-shadow:0 6px 16px -8px rgba(120,90,140,.6)}
    .burger span,.burger span::before,.burger span::after{content:"";display:block;width:18px;height:2.5px;border-radius:2px;background:var(--ink)}
    .burger span{position:relative}
    .burger span::before{position:absolute;top:-6px}.burger span::after{position:absolute;top:6px}

    .backdrop{position:fixed;inset:0;z-index:45;background:rgba(74,59,82,.34);border:0;opacity:0;visibility:hidden;transition:.3s}
    body.menu-is-open .backdrop{opacity:1;visibility:visible}
    .menu{position:fixed;top:0;right:0;z-index:46;height:100%;width:min(84vw,320px);background:var(--card);
      border-radius:32px 0 0 32px;padding:24px;transform:translateX(103%);transition:transform .3s ease;
      display:flex;flex-direction:column;gap:14px;box-shadow:-20px 0 50px -30px rgba(120,90,140,.7)}
    body.menu-is-open .menu{transform:none}
    .menu-top{display:flex;align-items:center;justify-content:space-between}
    .menu-x{width:44px;height:44px;border-radius:50%;border:0;background:var(--bg);font-size:1.3rem;color:var(--muted)}
    .menu nav{display:flex;flex-direction:column;gap:8px}
    .menu nav a{padding:14px 16px;border-radius:16px;font-weight:600;font-size:1.05rem}
    .menu nav a:nth-child(5n+1){background:var(--pink)}
    .menu nav a:nth-child(5n+2){background:var(--lilac)}
    .menu nav a:nth-child(5n+3){background:var(--mint)}
    .menu nav a:nth-child(5n+4){background:var(--lemon)}
    .menu nav a:nth-child(5n+5){background:var(--sky)}
    .menu-note{margin-top:auto;font-size:.78rem;color:var(--muted)}

    section{padding-block:44px}

    .hero{padding-top:34px;text-align:center}
    .hero h1{font-size:clamp(2.4rem,11vw,4.4rem);font-weight:800;line-height:1.02;letter-spacing:-.02em;margin-top:18px}
    .hero h1 b{background:linear-gradient(120deg,#ff7fb0,#a67bff);-webkit-background-clip:text;background-clip:text;color:transparent}
    .hero-lead{margin:18px auto 0;max-width:40ch;font-size:1.08rem;color:#6b5c76}
    .hero-actions{display:flex;flex-direction:column;align-items:center;gap:12px;margin-top:26px}
    .btn{display:inline-flex;align-items:center;justify-content:center;min-height:54px;padding:0 30px;border-radius:999px;font-weight:700;transition:transform .15s}
    .btn:active{transform:scale(.96)}
    .btn-fill{color:#fff;background:linear-gradient(120deg,#ff7fb0,#a67bff);box-shadow:0 16px 30px -14px rgba(166,123,255,.9)}
    .btn-soft{background:#fff;color:#b5567f;box-shadow:0 10px 24px -14px rgba(120,90,140,.7)}
    .hero-media{margin-top:34px;position:relative}
    .hero-media img{width:100%;aspect-ratio:5/4;object-fit:cover;border-radius:40px;border:6px solid #fff;
      box-shadow:0 40px 70px -40px rgba(120,90,140,.9)}
    .blob{position:absolute;font-size:.78rem;font-weight:700;padding:12px 16px;border-radius:20px;background:#fff;
      box-shadow:0 14px 30px -16px rgba(120,90,140,.9);line-height:1.15}
    .blob-1{top:-16px;left:-6px;color:#b5567f;transform:rotate(-5deg)}
    .blob-2{bottom:-16px;right:-6px;color:#5a8f74;transform:rotate(5deg)}

    .sec-head{text-align:center;max-width:56ch;margin:0 auto 26px}
    .sec-head h2{font-size:clamp(1.7rem,7vw,2.7rem);font-weight:800;line-height:1.1;margin-top:12px}
    .sec-head p{margin-top:12px;color:#6b5c76}

    .rating{display:flex;flex-direction:column;align-items:center;gap:4px;margin-bottom:20px}
    .stars{color:#ffb400;letter-spacing:3px;font-size:1.2rem}
    .rating small{color:var(--muted);font-size:.8rem}
    .quotes{display:grid;gap:16px}
    .quote{border-radius:var(--round);padding:24px;color:#4a3b52}
    .quote:nth-child(1){background:linear-gradient(150deg,#ffe1ec,#ffd0e2)}
    .quote:nth-child(2){background:linear-gradient(150deg,#e7dcff,#d9c2ff)}
    .quote:nth-child(3){background:linear-gradient(150deg,#d3f4e6,#a8ead0)}
    .quote blockquote{font-size:1.08rem;line-height:1.5;font-weight:500}
    .quote footer{margin-top:14px;font-size:.74rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:#7a6b85}

    .news{display:grid;gap:20px}
    .news-card{display:block;background:#fff;border-radius:var(--round);overflow:hidden;
      box-shadow:0 20px 44px -28px rgba(120,90,140,.8);transition:transform .18s}
    .news-card:active{transform:translateY(2px)}
    .news-card img{width:100%;aspect-ratio:16/10;object-fit:cover}
    .news-body{padding:20px}
    .news-label{display:inline-block;font-size:.68rem;font-weight:800;text-transform:uppercase;letter-spacing:.05em;
      color:#fff;background:linear-gradient(120deg,#ff9ec4,#b79bff);padding:5px 12px;border-radius:999px}
    .news-body h3{font-size:1.4rem;font-weight:800;margin-top:12px}
    .news-body p{margin-top:8px;color:#6b5c76}
    .news-link{display:inline-block;margin-top:12px;font-weight:700;color:#b5567f}

    .prods{display:grid;gap:14px;grid-template-columns:1fr 1fr}
    .prod{display:block;background:#fff;border-radius:22px;overflow:hidden;box-shadow:0 16px 34px -24px rgba(120,90,140,.8);transition:transform .16s}
    .prod:active{transform:scale(.97)}
    .prod-media{display:block;position:relative;aspect-ratio:1;overflow:hidden}
    .prod-media img{width:100%;height:100%;object-fit:cover}
    .prod-copy{display:block;padding:12px 14px 16px}
    .prod-copy h3{font-size:1.08rem;font-weight:800}
    .prod-copy p{font-size:.82rem;color:var(--muted);margin-top:3px}
    .prod-tag{position:absolute;top:8px;left:8px;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;
      font-size:.7rem;font-weight:800;color:#fff;background:rgba(74,59,82,.55);backdrop-filter:blur(4px)}

    .process{position:relative}
    .steps{display:grid;gap:16px;margin-top:26px}
    .step{background:#fff;border-radius:var(--round);padding:22px;text-align:center;box-shadow:0 16px 40px -30px rgba(120,90,140,.8)}
    .step b{display:inline-grid;place-items:center;width:56px;height:56px;border-radius:50%;font-size:1.3rem;font-weight:800;color:#fff}
    .step:nth-child(1) b{background:linear-gradient(120deg,#ff9ec4,#ff7fb0)}
    .step:nth-child(2) b{background:linear-gradient(120deg,#c2a8ff,#a67bff)}
    .step:nth-child(3) b{background:linear-gradient(120deg,#8fe6c0,#5fcf9e)}
    .step small{display:block;text-transform:uppercase;letter-spacing:.1em;font-size:.66rem;color:var(--muted);margin-top:12px;font-weight:700}
    .step h3{font-size:1.25rem;font-weight:800;margin-top:4px}
    .step p{margin-top:8px;color:#6b5c76;font-size:.94rem}

    .final{text-align:center}
    .final-box{background:linear-gradient(135deg,#ffd0e2,#d9c2ff 55%,#bfe0ff);border-radius:34px;padding:40px 24px;
      box-shadow:0 30px 60px -36px rgba(120,90,140,.9)}
    .final-box h2{font-size:clamp(1.9rem,8vw,3rem);font-weight:800;line-height:1.06}
    .final-box .btn{margin-top:22px}

    .foot{padding:36px 0 96px;text-align:center}
    .foot .brand{justify-content:center;margin-bottom:14px}
    .foot nav{display:flex;justify-content:center;flex-wrap:wrap;gap:18px}
    .foot nav a{font-size:.84rem;color:var(--muted)}
    .foot p{font-size:.78rem;color:var(--muted);margin-top:12px}

    .mk-switcher{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:50;
      display:flex;gap:4px;max-width:calc(100% - 24px);overflow-x:auto;padding:5px;border-radius:999px;
      background:rgba(255,255,255,.92);backdrop-filter:blur(8px);box-shadow:0 16px 34px -18px rgba(120,90,140,.9);scrollbar-width:none}
    .mk-switcher::-webkit-scrollbar{display:none}
    .mk-switcher a{flex:0 0 auto;min-width:32px;height:32px;display:grid;place-items:center;padding:0 8px;
      border-radius:999px;font-size:.72rem;font-weight:700;color:var(--muted)}
    .mk-switcher a[aria-current="page"]{color:#fff;background:linear-gradient(120deg,#ff7fb0,#a67bff)}

    @media(min-width:720px){
      .quotes{grid-template-columns:repeat(3,1fr)}
      .news{grid-template-columns:1fr 1fr}
      .prods{grid-template-columns:repeat(4,1fr)}
      .steps{grid-template-columns:repeat(3,1fr)}
      .hero-actions{flex-direction:row;justify-content:center}
    }
  </style>
</head>
<body data-concept="gelataria" data-mockup-page="8">
  <div id="app"></div>
  <script src="mockups-data.js?v=20260718"></script>
  <script>
  (function(){
    var M=window.MIA,e=M.esc,app=document.getElementById("app");
    var nav=M.nav.map(function(n){return '<a href="'+n.href+'">'+e(n.label)+'</a>';}).join("");

    var quotes=M.quotes.map(function(q){
      return '<figure class="quote"><span class="stars" aria-label="5 estrelas">★★★★★</span><blockquote>“'+e(q.text)+'”</blockquote><footer>'+e(q.source)+'</footer></figure>';
    }).join("");

    var news=M.news.map(function(n){
      return '<a class="news-card" href="'+n.href+'"><img src="'+n.image+'" alt="'+e(n.alt)+'" loading="lazy">'+
        '<span class="news-body"><span class="news-label">'+e(n.label)+'</span><h3>'+e(n.title)+'</h3>'+
        '<p>'+e(n.text)+'</p><span class="news-link">'+e(n.cta)+' →</span></span></a>';
    }).join("");

    var prods=M.products.map(function(p,i){
      var num=(i+1<10?"0":"")+(i+1);
      return '<a class="prod" href="'+p.href+'"><span class="prod-media"><img src="'+p.image+'" alt="'+e(p.alt)+'" loading="lazy"><span class="prod-tag">'+num+'</span></span>'+
        '<span class="prod-copy"><h3>'+e(p.name)+'</h3><p>'+e(p.text)+'</p></span></a>';
    }).join("");

    var steps=M.process.map(function(s){
      return '<article class="step"><b>'+s.n+'</b><small>'+e(s.key)+'</small><h3>'+e(s.title)+'</h3><p>'+e(s.text)+'</p></article>';
    }).join("");

    app.innerHTML=[
      '<header class="head">',
        '<a class="brand" href="index.html" aria-label="Ver todos os mockups"><img src="'+M.logo+'" alt="" width="92" height="92"><span>Mia &amp; Paper</span></a>',
        '<div class="head-actions"><a class="cta-mini" href="'+M.catalog+'">Catálogo</a>',
        '<button class="burger" type="button" aria-label="Abrir menu" aria-expanded="false" data-menu-button><span></span></button></div>',
      '</header>',

      '<button class="backdrop" type="button" aria-label="Fechar menu" data-menu-close></button>',
      '<aside class="menu" aria-label="Menu principal" aria-hidden="true" data-menu-panel>',
        '<div class="menu-top"><span class="brand"><img src="'+M.logo+'" alt="" width="92" height="92"><span>Mia &amp; Paper</span></span>',
        '<button class="menu-x" type="button" aria-label="Fechar menu" data-menu-close>×</button></div>',
        '<nav>'+nav+'<a href="'+M.catalog+'">Catálogo simples</a></nav>',
        '<p class="menu-note">Mockup visual isolado. A homepage real não foi alterada.</p>',
      '</aside>',

      '<main class="wrap">',
        '<section class="hero" id="inicio" aria-labelledby="h8-title">',
          '<span class="eyebrow">Papelaria personalizada</span>',
          '<h1 id="h8-title">Escolhe. <b>Personaliza.</b> Guarda.</h1>',
          '<p class="hero-lead">Produtos de papelaria e presentes que começam numa base simples e acabam com a tua combinação.</p>',
          '<div class="hero-actions"><a class="btn btn-fill" href="#produtos">Explorar produtos</a><a class="btn btn-soft" href="#novidades">Ver novidades</a></div>',
          '<figure class="hero-media"><img src="'+M.hero.image+'" alt="'+e(M.hero.alt)+'" width="1200" height="960">',
            '<span class="blob blob-1">Por encomenda 🎀</span><span class="blob blob-2">Feito em Portugal</span></figure>',
        '</section>',

        '<section id="testemunhos" aria-labelledby="t8-title">',
          '<div class="sec-head"><span class="eyebrow">Testemunhos</span><h2 id="t8-title">Peças que chegam e ficam.</h2></div>',
          '<div class="rating"><span class="stars" aria-label="5 estrelas">★★★★★</span><small>5 estrelas · textos provisórios</small></div>',
          '<div class="quotes">'+quotes+'</div>',
        '</section>',

        '<section id="novidades" aria-labelledby="n8-title">',
          '<div class="sec-head"><span class="eyebrow">Novidades</span><h2 id="n8-title">O que chegou ao atelier.</h2><p>Novos produtos e novas formas de personalizar o teu pedido.</p></div>',
          '<div class="news">'+news+'</div>',
        '</section>',

        '<section id="produtos" aria-labelledby="p8-title">',
          '<div class="sec-head"><span class="eyebrow">Produtos</span><h2 id="p8-title">Começa pela categoria certa.</h2><p>Sete pontos de partida, cada um com as suas opções e materiais.</p></div>',
          '<div class="prods">'+prods+'</div>',
        '</section>',

        '<section class="process" id="como-encomendar" aria-labelledby="c8-title">',
          '<div class="sec-head"><span class="eyebrow">Como encomendar</span><h2 id="c8-title">Do primeiro clique ao pedido final.</h2><p>Curto e claro, mesmo com muitos pormenores para escolher.</p></div>',
          '<div class="steps">'+steps+'</div>',
        '</section>',

        '<section class="final"><div class="final-box"><h2>Já sabes o que procuras?</h2><a class="btn btn-fill" href="'+M.catalog+'">Abrir catálogo</a></div></section>',
      '</main>',

      '<footer class="foot"><div class="wrap"><span class="brand"><img src="'+M.logo+'" alt="" width="92" height="92"><span>Mia &amp; Paper</span></span>',
        '<nav><a href="'+M.base+'privacy.html">Privacidade</a><a href="'+M.base+'contacto.html">Contacto</a><a href="index.html">Todos os mockups</a></nav>',
        '<p>© Mia &amp; Paper 2026 · mockup visual</p></div></footer>',

      M.switcherHTML(8)
    ].join("");

    M.wireMenu();
  })();
  </script>
</body>
</html>

<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#eee7d8">
  <title>Mockup 06 · Linho Sereno | Mia &amp; Paper</title>
  <meta name="description" content="Proposta de homepage Mia & Paper serena e arejada, com tons de linho e muito espaço em branco.">
  <style>
    :root{
      --paper:#f4efe4; --paper-2:#efe8d9; --card:#faf6ee;
      --ink:#3a352b; --muted:#8a8172; --line:rgba(58,53,43,.14);
      --sage:#9aa583; --sage-deep:#6f7a58; --clay:#c69f86;
      --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
      --sans:"Segoe UI",system-ui,-apple-system,Helvetica,Arial,sans-serif;
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth;overflow-x:hidden}
    body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);
      font-weight:400;line-height:1.65;-webkit-font-smoothing:antialiased;overflow-x:hidden}
    body.menu-is-open{overflow:hidden}
    img{display:block;max-width:100%}
    a{color:inherit;text-decoration:none}
    button{font:inherit;color:inherit;cursor:pointer}
    h1,h2,h3,p,blockquote{margin:0;font-weight:400}
    .wrap{width:min(100% - 44px,1080px);margin-inline:auto}
    .eyebrow{font-family:var(--sans);text-transform:uppercase;letter-spacing:.28em;
      font-size:.68rem;color:var(--sage-deep);font-weight:600}

    .head{position:sticky;top:0;z-index:40;
      background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(12px);
      border-bottom:1px solid var(--line);
      display:flex;align-items:center;justify-content:space-between;gap:10px;
      padding:14px max(22px,calc((100% - 1080px)/2))}
    .brand{display:inline-flex;align-items:center;gap:11px}
    .brand img{width:40px;height:40px;border-radius:50%;object-fit:cover;border:1px solid var(--line)}
    .brand span{font-family:var(--serif);font-size:1.15rem;letter-spacing:.01em}
    .head-actions{display:flex;align-items:center;gap:10px}
    .cta-mini{display:inline-flex;align-items:center;min-height:44px;padding:0 18px;border-radius:999px;
      border:1px solid var(--sage-deep);color:var(--sage-deep);font-size:.82rem;letter-spacing:.02em}
    .burger{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:transparent;
      display:grid;place-items:center;gap:0}
    .burger span,.burger span::before,.burger span::after{content:"";display:block;width:18px;height:1px;background:var(--ink)}
    .burger span{position:relative}
    .burger span::before{position:absolute;top:-6px}.burger span::after{position:absolute;top:6px}

    .backdrop{position:fixed;inset:0;z-index:45;background:rgba(58,53,43,.32);border:0;opacity:0;visibility:hidden;transition:.3s}
    body.menu-is-open .backdrop{opacity:1;visibility:visible}
    .menu{position:fixed;top:0;right:0;z-index:46;height:100%;width:min(84vw,320px);background:var(--card);
      border-left:1px solid var(--line);padding:26px 24px;transform:translateX(103%);transition:transform .32s ease;
      display:flex;flex-direction:column;gap:18px}
    body.menu-is-open .menu{transform:none}
    .menu-top{display:flex;align-items:center;justify-content:space-between}
    .menu-x{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:transparent;font-size:1.3rem;color:var(--muted)}
    .menu nav{display:flex;flex-direction:column}
    .menu nav a{padding:15px 0;border-bottom:1px solid var(--line);font-family:var(--serif);font-size:1.25rem}
    .menu-note{margin-top:auto;font-size:.78rem;color:var(--muted);line-height:1.6}

    section{padding-block:56px}

    .hero{padding-top:44px;text-align:center}
    .hero .eyebrow{display:block}
    .hero h1{font-family:var(--serif);font-weight:400;line-height:1.08;letter-spacing:-.01em;
      font-size:clamp(2.3rem,9vw,4.2rem);margin-top:20px}
    .hero h1 em{font-style:italic;color:var(--sage-deep)}
    .hero-lead{margin:22px auto 0;max-width:44ch;font-size:1.08rem;color:#544d40}
    .hero-actions{display:flex;flex-direction:column;align-items:center;gap:14px;margin-top:30px}
    .btn{display:inline-flex;align-items:center;justify-content:center;min-height:52px;padding:0 30px;border-radius:999px;
      font-size:.92rem;letter-spacing:.03em;transition:.2s}
    .btn-fill{background:var(--sage-deep);color:var(--card)}
    .btn-fill:active{background:var(--ink)}
    .btn-ghost{color:var(--sage-deep);border-bottom:1px solid var(--sage-deep);border-radius:0;min-height:auto;padding:6px 2px}
    .hero-media{margin-top:44px;position:relative}
    .hero-media img{width:100%;aspect-ratio:5/4;object-fit:cover;border-radius:180px 180px 20px 20px;
      box-shadow:0 40px 80px -50px rgba(58,53,43,.5)}
    .hero-cap{margin-top:16px;font-size:.82rem;color:var(--muted);letter-spacing:.04em}

    .sec-head{max-width:60ch;margin-inline:auto;text-align:center}
    .sec-head h2{font-family:var(--serif);font-weight:400;line-height:1.14;
      font-size:clamp(1.7rem,6vw,2.7rem);margin-top:14px}
    .sec-head p{margin-top:14px;color:#544d40}

    .rating{display:flex;flex-direction:column;align-items:center;gap:6px;margin-bottom:30px}
    .stars{color:var(--clay);letter-spacing:4px;font-size:1.1rem}
    .rating small{color:var(--muted);font-size:.8rem;letter-spacing:.04em}
    .quotes{display:grid;gap:20px;margin-top:8px}
    .quote{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:28px 26px;text-align:center}
    .quote blockquote{font-family:var(--serif);font-style:italic;font-size:1.18rem;line-height:1.5;color:#463f33}
    .quote footer{margin-top:18px;font-size:.74rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}

    .news{display:grid;gap:30px;margin-top:36px}
    .news-card{display:block;text-align:center}
    .news-card img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:20px}
    .news-label{display:block;margin-top:18px;font-size:.7rem;letter-spacing:.22em;text-transform:uppercase;color:var(--sage-deep)}
    .news-card h3{font-family:var(--serif);font-weight:400;font-size:1.5rem;margin-top:8px}
    .news-card p{margin-top:8px;color:#544d40;max-width:40ch;margin-inline:auto}
    .news-link{display:inline-block;margin-top:12px;font-size:.86rem;color:var(--sage-deep);border-bottom:1px solid var(--sage-deep)}

    .prods{display:grid;gap:0;margin-top:36px;border-top:1px solid var(--line)}
    .prod{display:flex;align-items:center;gap:18px;padding:18px 4px;border-bottom:1px solid var(--line);transition:.2s}
    .prod:active{background:var(--card)}
    .prod img{width:74px;height:74px;flex:0 0 auto;object-fit:cover;border-radius:50%;border:1px solid var(--line)}
    .prod-copy{flex:1;min-width:0}
    .prod-copy h3{font-family:var(--serif);font-size:1.3rem}
    .prod-copy p{font-size:.9rem;color:var(--muted)}
    .prod-arrow{color:var(--sage-deep);font-size:1.1rem}

    .process{background:var(--paper-2)}
    .steps{display:grid;gap:34px;margin-top:40px;counter-reset:s}
    .step{text-align:center}
    .step b{display:inline-grid;place-items:center;width:56px;height:56px;border-radius:50%;
      border:1px solid var(--sage-deep);color:var(--sage-deep);font-family:var(--serif);font-size:1.3rem}
    .step h3{font-family:var(--serif);font-weight:400;font-size:1.35rem;margin-top:16px}
    .step small{display:block;text-transform:uppercase;letter-spacing:.2em;font-size:.66rem;color:var(--muted);margin-top:4px}
    .step p{margin-top:8px;color:#544d40;max-width:34ch;margin-inline:auto}

    .final{text-align:center}
    .final h2{font-family:var(--serif);font-weight:400;font-size:clamp(1.9rem,7vw,3rem);line-height:1.1}
    .final .btn{margin-top:26px}

    .foot{border-top:1px solid var(--line);padding:40px 0 96px;text-align:center}
    .foot .brand{justify-content:center;margin-bottom:16px}
    .foot nav{display:flex;justify-content:center;flex-wrap:wrap;gap:20px;margin-top:10px}
    .foot nav a{font-size:.84rem;color:var(--muted)}
    .foot p{font-size:.78rem;color:var(--muted);margin-top:14px}

    .mk-switcher{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:50;
      display:flex;gap:4px;max-width:calc(100% - 24px);overflow-x:auto;padding:5px;border-radius:999px;
      background:color-mix(in srgb,var(--card) 94%,transparent);backdrop-filter:blur(8px);
      border:1px solid var(--line);box-shadow:0 12px 30px -14px rgba(58,53,43,.5);scrollbar-width:none}
    .mk-switcher::-webkit-scrollbar{display:none}
    .mk-switcher a{flex:0 0 auto;min-width:32px;height:32px;display:grid;place-items:center;padding:0 8px;
      border-radius:999px;font-size:.72rem;color:var(--muted);letter-spacing:.02em}
    .mk-switcher a[aria-current="page"]{background:var(--sage-deep);color:var(--card)}

    @media(min-width:720px){
      .quotes{grid-template-columns:repeat(3,1fr)}
      .news{grid-template-columns:1fr 1fr;gap:44px}
      .steps{grid-template-columns:repeat(3,1fr)}
      .hero-actions{flex-direction:row;justify-content:center}
    }
  </style>
</head>
<body data-concept="linho" data-mockup-page="6">
  <div id="app"></div>
  <script src="mockups-data.js?v=20260718"></script>
  <script>
  (function(){
    var M=window.MIA,e=M.esc,app=document.getElementById("app");
    var nav=M.nav.map(function(n){return '<a href="'+n.href+'">'+e(n.label)+'</a>';}).join("");

    var quotes=M.quotes.map(function(q){
      return '<figure class="quote"><blockquote>“'+e(q.text)+'”</blockquote><footer>'+e(q.source)+'</footer></figure>';
    }).join("");

    var news=M.news.map(function(n){
      return '<a class="news-card" href="'+n.href+'"><img src="'+n.image+'" alt="'+e(n.alt)+'" loading="lazy">'+
        '<span class="news-label">'+e(n.label)+'</span><h3>'+e(n.title)+'</h3><p>'+e(n.text)+'</p>'+
        '<span class="news-link">'+e(n.cta)+'</span></a>';
    }).join("");

    var prods=M.products.map(function(p){
      return '<a class="prod" href="'+p.href+'"><img src="'+p.image+'" alt="'+e(p.alt)+'" loading="lazy">'+
        '<span class="prod-copy"><h3>'+e(p.name)+'</h3><p>'+e(p.text)+'</p></span>'+
        '<span class="prod-arrow" aria-hidden="true">→</span></a>';
    }).join("");

    var steps=M.process.map(function(s){
      return '<article class="step"><b>'+s.n+'</b><small>'+e(s.key)+'</small><h3>'+e(s.title)+'</h3><p>'+e(s.text)+'</p></article>';
    }).join("");

    app.innerHTML=[
      '<header class="head">',
        '<a class="brand" href="index.html" aria-label="Ver todos os mockups"><img src="'+M.logo+'" alt="" width="92" height="92"><span>Mia &amp; Paper</span></a>',
        '<div class="head-actions"><a class="cta-mini" href="'+M.catalog+'">Ver catálogo</a>',
        '<button class="burger" type="button" aria-label="Abrir menu" aria-expanded="false" data-menu-button><span></span></button></div>',
      '</header>',

      '<button class="backdrop" type="button" aria-label="Fechar menu" data-menu-close></button>',
      '<aside class="menu" aria-label="Menu principal" aria-hidden="true" data-menu-panel>',
        '<div class="menu-top"><span class="brand"><img src="'+M.logo+'" alt="" width="92" height="92"><span>Mia &amp; Paper</span></span>',
        '<button class="menu-x" type="button" aria-label="Fechar menu" data-menu-close>×</button></div>',
        '<nav>'+nav+'<a href="'+M.catalog+'">Catálogo simples</a></nav>',
        '<p class="menu-note">Mockup visual isolado. A homepage real não foi alterada.</p>',
      '</aside>',

      '<main class="wrap">',
        '<section class="hero" id="inicio" aria-labelledby="h6-title">',
          '<span class="eyebrow">Papelaria personalizada · por encomenda</span>',
          '<h1 id="h6-title">Papel, memórias e peças<br><em>com um lugar só teu.</em></h1>',
          '<p class="hero-lead">Cadernos, molduras e lembranças que podes adaptar à pessoa, à data e à história — feitos com calma, em pequena escala.</p>',
          '<div class="hero-actions"><a class="btn btn-fill" href="#produtos">Ver a coleção</a><a class="btn btn-ghost" href="#novidades">Descobrir novidades</a></div>',
          '<figure class="hero-media"><img src="'+M.hero.image+'" alt="'+e(M.hero.alt)+'" width="1200" height="900"><figcaption class="hero-cap">Preparado por encomenda · Portugal</figcaption></figure>',
        '</section>',

        '<section id="testemunhos" aria-labelledby="t6-title">',
          '<div class="sec-head"><span class="eyebrow">Testemunhos · textos provisórios</span><h2 id="t6-title">O que fica depois de abrir a embalagem.</h2></div>',
          '<div class="rating"><span class="stars" aria-label="5 estrelas">★★★★★</span><small>5 estrelas · textos provisórios</small></div>',
          '<div class="quotes">'+quotes+'</div>',
        '</section>',

        '<section id="novidades" aria-labelledby="n6-title">',
          '<div class="sec-head"><span class="eyebrow">Novidades</span><h2 id="n6-title">O que chegou ao atelier.</h2><p>Novos produtos e novas formas de personalizar o teu pedido, apresentados sem ruído.</p></div>',
          '<div class="news">'+news+'</div>',
        '</section>',

        '<section id="produtos" aria-labelledby="p6-title">',
          '<div class="sec-head"><span class="eyebrow">Produtos · sete pontos de partida</span><h2 id="p6-title">Começa pela categoria certa.</h2></div>',
          '<div class="prods">'+prods+'</div>',
        '</section>',
      '</main>',

      '<section class="process" id="como-encomendar" aria-labelledby="c6-title"><div class="wrap">',
        '<div class="sec-head"><span class="eyebrow">Como encomendar</span><h2 id="c6-title">Do primeiro clique ao pedido final.</h2><p>O processo mantém-se curto e claro, mesmo quando há muitos pormenores para escolher.</p></div>',
        '<div class="steps">'+steps+'</div>',
      '</div></section>',

      '<main class="wrap"><section class="final"><h2>Já sabes o que procuras?</h2><a class="btn btn-fill" href="'+M.catalog+'">Abrir catálogo</a></section></main>',

      '<footer class="foot"><div class="wrap"><span class="brand"><img src="'+M.logo+'" alt="" width="92" height="92"><span>Mia &amp; Paper</span></span>',
        '<nav><a href="'+M.base+'privacy.html">Privacidade</a><a href="'+M.base+'contacto.html">Contacto</a><a href="index.html">Todos os mockups</a></nav>',
        '<p>© Mia &amp; Paper 2026 · mockup visual</p></div></footer>',

      M.switcherHTML(6)
    ].join("");

    M.wireMenu();
  })();
  </script>
</body>
</html>

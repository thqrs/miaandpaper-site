<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#f4f4f2">
  <title>Mockup 10 · Grelha Suíça | Mia &amp; Paper</title>
  <meta name="description" content="Proposta de homepage Mia & Paper tipográfica e sóbria, com grelha suíça e um único acento vermelho.">
  <style>
    :root{
      --paper:#f4f4f2; --ink:#111110; --muted:#6b6b66; --red:#e5321b; --line:#111110;
      --line-soft:rgba(17,17,16,.16);
      --sans:"Helvetica Neue","Segoe UI",Arial,system-ui,sans-serif;
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    html{overflow-x:hidden}
    body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);line-height:1.5;
      -webkit-font-smoothing:antialiased;overflow-x:hidden;letter-spacing:-.005em}
    body.menu-is-open{overflow:hidden}
    img{display:block;max-width:100%}
    a{color:inherit;text-decoration:none}
    button{font:inherit;color:inherit;cursor:pointer}
    h1,h2,h3,p,blockquote{margin:0;font-weight:400}
    .wrap{width:min(100% - 32px,1160px);margin-inline:auto}
    .eyebrow{font-size:.68rem;text-transform:uppercase;letter-spacing:.16em;font-weight:700}
    .eyebrow em{font-style:normal;color:var(--red)}

    .head{position:sticky;top:0;z-index:40;background:var(--paper);border-bottom:2px solid var(--line);
      display:flex;align-items:center;justify-content:space-between;gap:10px;
      padding:10px max(16px,calc((100% - 1160px)/2))}
    .brand{display:inline-flex;align-items:center;gap:10px;font-weight:800;letter-spacing:-.02em;text-transform:uppercase;font-size:.95rem}
    .brand img{width:38px;height:38px;border-radius:0;object-fit:cover}
    .head-actions{display:flex;align-items:center;gap:8px}
    .cta-mini{display:inline-flex;align-items:center;min-height:44px;padding:0 16px;border:2px solid var(--line);
      font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em}
    .cta-mini:active{background:var(--ink);color:var(--paper)}
    .burger{width:44px;height:44px;border:2px solid var(--line);background:transparent;display:grid;place-items:center}
    .burger span,.burger span::before,.burger span::after{content:"";display:block;width:18px;height:2px;background:var(--ink)}
    .burger span{position:relative}
    .burger span::before{position:absolute;top:-6px}.burger span::after{position:absolute;top:6px}

    .backdrop{position:fixed;inset:0;z-index:45;background:rgba(17,17,16,.5);border:0;opacity:0;visibility:hidden;transition:.25s}
    body.menu-is-open .backdrop{opacity:1;visibility:visible}
    .menu{position:fixed;top:0;right:0;z-index:46;height:100%;width:min(85vw,340px);background:var(--paper);
      border-left:2px solid var(--line);padding:20px;transform:translateX(103%);transition:transform .28s ease;
      display:flex;flex-direction:column;gap:14px}
    body.menu-is-open .menu{transform:none}
    .menu-top{display:flex;align-items:center;justify-content:space-between}
    .menu-x{width:44px;height:44px;border:2px solid var(--line);background:transparent;font-size:1.3rem}
    .menu nav{display:flex;flex-direction:column;border-top:1px solid var(--line-soft)}
    .menu nav a{padding:15px 4px;border-bottom:1px solid var(--line-soft);font-size:1.4rem;font-weight:600;
      display:flex;justify-content:space-between;align-items:baseline;letter-spacing:-.02em}
    .menu nav a span{font-size:.7rem;font-weight:700;color:var(--muted)}
    .menu-note{margin-top:auto;font-size:.76rem;color:var(--muted)}

    section{padding-block:0;border-bottom:2px solid var(--line)}
    .pad{padding-block:40px}
    .grid-head{display:grid;grid-template-columns:1fr;gap:6px}
    .grid-head .idx{font-size:.68rem;font-weight:700;color:var(--red);letter-spacing:.14em}

    /* hero */
    .hero{padding-top:32px;padding-bottom:0}
    .hero-top{display:flex;justify-content:space-between;align-items:baseline;font-size:.68rem;text-transform:uppercase;letter-spacing:.14em;font-weight:700;color:var(--muted)}
    .hero h1{font-size:clamp(2rem,9.2vw,5.25rem);font-weight:800;line-height:.94;letter-spacing:-.03em;margin-top:16px;text-transform:uppercase;overflow-wrap:break-word;hyphens:auto}
    .hero h1 em{font-style:normal;color:var(--red)}
    .hero-lead{margin-top:20px;max-width:42ch;font-size:1.05rem;color:#33332e}
    .hero-actions{display:flex;flex-wrap:wrap;gap:0;margin-top:24px;border:2px solid var(--line)}
    .btn{display:inline-flex;align-items:center;justify-content:center;min-height:54px;padding:0 26px;flex:1 1 auto;
      font-size:.76rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em}
    .btn-1{background:var(--ink);color:var(--paper)}
    .btn-2{background:transparent;border-left:2px solid var(--line)}
    .hero-media{margin-top:30px;border-top:2px solid var(--line)}
    .hero-media img{width:100%;aspect-ratio:16/10;object-fit:cover}
    .hero-cap{display:flex;justify-content:space-between;padding:10px 0;font-size:.68rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:700}

    .sec-head h2{font-size:clamp(1.7rem,7vw,3rem);font-weight:800;line-height:1;letter-spacing:-.025em;text-transform:uppercase;margin-top:6px;overflow-wrap:break-word}
    .sec-head p{margin-top:12px;max-width:52ch;color:#33332e}

    /* testimonials */
    .rating{display:flex;align-items:baseline;gap:12px;margin-top:22px;padding-bottom:14px;border-bottom:1px solid var(--line-soft)}
    .stars{color:var(--red);letter-spacing:3px}
    .rating small{font-size:.7rem;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:700}
    .quotes{display:grid;grid-template-columns:1fr}
    .quote{padding:24px 0;border-bottom:1px solid var(--line-soft);display:grid;gap:10px}
    .quote-n{font-size:.68rem;font-weight:700;color:var(--red);letter-spacing:.14em}
    .quote blockquote{font-size:1.2rem;line-height:1.4;font-weight:500;letter-spacing:-.01em}
    .quote footer{font-size:.7rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:700}

    /* news */
    .news{display:grid;grid-template-columns:1fr;margin-top:22px;border-top:1px solid var(--line-soft)}
    .news-card{display:grid;gap:14px;padding:22px 0;border-bottom:1px solid var(--line-soft)}
    .news-card img{width:100%;aspect-ratio:16/9;object-fit:cover}
    .news-label{font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.12em;color:var(--red)}
    .news-card h3{font-size:1.5rem;font-weight:800;letter-spacing:-.02em;margin-top:4px}
    .news-card p{margin-top:8px;color:#33332e}
    .news-link{margin-top:10px;font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;border-bottom:2px solid var(--red);display:inline-block;padding-bottom:2px}

    /* products */
    .prods{margin-top:22px;border-top:2px solid var(--line)}
    .prod{display:grid;grid-template-columns:34px 64px 1fr auto;align-items:center;gap:14px;padding:12px 0;border-bottom:1px solid var(--line-soft)}
    .prod:active{background:rgba(17,17,16,.05)}
    .prod-n{font-size:.72rem;font-weight:700;color:var(--red)}
    .prod img{width:64px;height:64px;object-fit:cover}
    .prod-copy h3{font-size:1.15rem;font-weight:700;letter-spacing:-.01em}
    .prod-copy p{font-size:.84rem;color:var(--muted)}
    .prod-arrow{font-size:1.2rem}

    /* process */
    .steps{margin-top:22px;border-top:2px solid var(--line)}
    .step{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:start;padding:22px 0;border-bottom:1px solid var(--line-soft)}
    .step b{font-size:2.6rem;font-weight:800;line-height:.8;color:var(--red);letter-spacing:-.04em}
    .step small{font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.14em;color:var(--muted)}
    .step h3{font-size:1.3rem;font-weight:700;letter-spacing:-.01em;margin-top:2px}
    .step p{margin-top:6px;color:#33332e;max-width:44ch}

    /* final */
    .final{display:flex;flex-direction:column;gap:18px}
    .final h2{font-size:clamp(2rem,9vw,3.6rem);font-weight:800;line-height:.98;letter-spacing:-.03em;text-transform:uppercase}
    .final .btn{border:2px solid var(--line)}

    .foot{border-bottom:0;padding:26px 0 96px}
    .foot .wrap{display:flex;flex-direction:column;gap:12px}
    .foot-top{display:flex;justify-content:space-between;align-items:center;font-weight:800;text-transform:uppercase;letter-spacing:-.02em}
    .foot nav{display:flex;flex-wrap:wrap;gap:16px}
    .foot nav a{font-size:.72rem;text-transform:uppercase;letter-spacing:.1em;font-weight:700;color:var(--muted)}
    .foot p{font-size:.7rem;color:var(--muted);letter-spacing:.06em}

    .mk-switcher{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:50;
      display:flex;gap:0;max-width:calc(100% - 24px);overflow-x:auto;padding:0;
      background:var(--paper);border:2px solid var(--line);scrollbar-width:none}
    .mk-switcher::-webkit-scrollbar{display:none}
    .mk-switcher a{flex:0 0 auto;min-width:34px;height:34px;display:grid;place-items:center;padding:0 9px;
      font-size:.72rem;font-weight:700;border-right:1px solid var(--line-soft)}
    .mk-switcher a:last-child{border-right:0}
    .mk-switcher a[aria-current="page"]{background:var(--red);color:#fff}

    @media(min-width:720px){
      .quotes{grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line-soft);border:1px solid var(--line-soft)}
      .quotes .quote{background:var(--paper);padding:24px;border-bottom:0}
      .news{grid-template-columns:1fr 1fr;gap:1px;background:var(--line-soft);border:1px solid var(--line-soft)}
      .news .news-card{background:var(--paper);padding:22px;border-bottom:0}
      .steps{grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line-soft);border:1px solid var(--line-soft);border-top:2px solid var(--line)}
      .steps .step{background:var(--paper);grid-template-columns:1fr;padding:24px;border-bottom:0}
      .hero{display:grid;grid-template-columns:1fr 1fr;gap:36px;align-items:end}
      .hero-media{margin-top:0;border-top:0}
    }
  </style>
</head>
<body data-concept="suica" data-mockup-page="10">
  <div id="app"></div>
  <script src="mockups-data.js?v=20260718"></script>
  <script>
  (function(){
    var M=window.MIA,e=M.esc,app=document.getElementById("app");
    var nav=M.nav.map(function(n,i){var num="0"+(i+1);return '<a href="'+n.href+'">'+e(n.label)+'<span>'+num+'</span></a>';}).join("");

    var quotes=M.quotes.map(function(q,i){
      return '<figure class="quote"><span class="quote-n">'+"0"+(i+1)+' / 03</span><blockquote>“'+e(q.text)+'”</blockquote><footer>'+e(q.source)+'</footer></figure>';
    }).join("");

    var news=M.news.map(function(n){
      return '<a class="news-card" href="'+n.href+'"><img src="'+n.image+'" alt="'+e(n.alt)+'" loading="lazy">'+
        '<span><span class="news-label">'+e(n.label)+'</span><h3>'+e(n.title)+'</h3>'+
        '<p>'+e(n.text)+'</p><span class="news-link">'+e(n.cta)+'</span></span></a>';
    }).join("");

    var prods=M.products.map(function(p,i){
      var num=(i+1<10?"0":"")+(i+1);
      return '<a class="prod" href="'+p.href+'"><span class="prod-n">'+num+'</span><img src="'+p.image+'" alt="'+e(p.alt)+'" loading="lazy">'+
        '<span class="prod-copy"><h3>'+e(p.name)+'</h3><p>'+e(p.text)+'</p></span>'+
        '<span class="prod-arrow" aria-hidden="true">→</span></a>';
    }).join("");

    var steps=M.process.map(function(s){
      return '<article class="step"><b>'+s.n+'</b><div><small>'+e(s.key)+'</small><h3>'+e(s.title)+'</h3><p>'+e(s.text)+'</p></div></article>';
    }).join("");

    app.innerHTML=[
      '<header class="head">',
        '<a class="brand" href="index.html" aria-label="Ver todos os mockups"><img src="'+M.logo+'" alt="" width="92" height="92"><span>Mia &amp; Paper</span></a>',
        '<div class="head-actions"><a class="cta-mini" href="'+M.catalog+'">Catálogo</a>',
        '<button class="burger" type="button" aria-label="Abrir menu" aria-expanded="false" data-menu-button><span></span></button></div>',
      '</header>',

      '<button class="backdrop" type="button" aria-label="Fechar menu" data-menu-close></button>',
      '<aside class="menu" aria-label="Menu principal" aria-hidden="true" data-menu-panel>',
        '<div class="menu-top"><span class="brand"><img src="'+M.logo+'" alt="" width="92" height="92"><span>Mia &amp; Paper</span></span>',
        '<button class="menu-x" type="button" aria-label="Fechar menu" data-menu-close>×</button></div>',
        '<nav>'+nav+'<a href="'+M.catalog+'">Catálogo<span>→</span></a></nav>',
        '<p class="menu-note">Mockup visual isolado. A homepage real não foi alterada.</p>',
      '</aside>',

      '<section class="hero wrap" id="inicio" aria-labelledby="h10-title">',
        '<div><div class="hero-top"><span>Mia &amp; Paper — atelier</span><span>Portugal · 2026</span></div>',
          '<h1 id="h10-title">Personalização <em>sem</em> ruído.</h1>',
          '<p class="hero-lead">Escolhe um produto, diz-nos o que queres mudar e acompanha uma encomenda pensada para ti. Uma ideia clara, as escolhas certas, um resultado pessoal.</p>',
          '<div class="hero-actions"><a class="btn btn-1" href="#produtos">Explorar produtos</a><a class="btn btn-2" href="#novidades">Novidades</a></div>',
        '</div>',
        '<figure class="hero-media"><img src="'+M.hero.image+'" alt="'+e(M.hero.alt)+'" width="1200" height="750"><figcaption class="hero-cap"><span>Fig. 01 — Caderno + crachá</span><span>Por encomenda</span></figcaption></figure>',
      '</section>',

      '<section id="testemunhos" aria-labelledby="t10-title"><div class="wrap pad">',
        '<div class="sec-head"><span class="eyebrow"><em>01</em> / Testemunhos — textos provisórios</span><h2 id="t10-title">Peças que chegam e ficam.</h2></div>',
        '<div class="rating"><span class="stars" aria-label="5 estrelas">★★★★★</span><small>5 estrelas</small></div>',
        '<div class="quotes">'+quotes+'</div>',
      '</div></section>',

      '<section id="novidades" aria-labelledby="n10-title"><div class="wrap pad">',
        '<div class="sec-head"><span class="eyebrow"><em>02</em> / Novidades</span><h2 id="n10-title">O que chegou ao atelier.</h2><p>Novos produtos e novas formas de personalizar o teu pedido.</p></div>',
        '<div class="news">'+news+'</div>',
      '</div></section>',

      '<section id="produtos" aria-labelledby="p10-title"><div class="wrap pad">',
        '<div class="sec-head"><span class="eyebrow"><em>03</em> / Produtos — sete categorias</span><h2 id="p10-title">Começa pela categoria certa.</h2></div>',
        '<div class="prods">'+prods+'</div>',
      '</div></section>',

      '<section id="como-encomendar" aria-labelledby="c10-title"><div class="wrap pad">',
        '<div class="sec-head"><span class="eyebrow"><em>04</em> / Como encomendar</span><h2 id="c10-title">Escolher · Personalizar · Confirmar.</h2></div>',
        '<div class="steps">'+steps+'</div>',
      '</div></section>',

      '<section id="final" aria-labelledby="f10-title"><div class="wrap pad final">',
        '<span class="eyebrow"><em>05</em> / Catálogo</span>',
        '<h2 id="f10-title">Já sabes o que procuras?</h2>',
        '<a class="btn" href="'+M.catalog+'">Abrir catálogo →</a>',
      '</div></section>',

      '<footer class="foot"><div class="wrap"><div class="foot-top"><span>Mia &amp; Paper</span><span>© 2026</span></div>',
        '<nav><a href="'+M.base+'privacy.html">Privacidade</a><a href="'+M.base+'contacto.html">Contacto</a><a href="index.html">Todos os mockups</a></nav>',
        '<p>Mockup visual · a homepage real não foi alterada.</p></div></footer>',

      M.switcherHTML(10)
    ].join("");

    M.wireMenu();
  })();
  </script>
</body>
</html>

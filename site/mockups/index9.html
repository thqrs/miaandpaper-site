<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#f0e7d2">
  <title>Mockup 09 · Recorte &amp; Fita | Mia &amp; Paper</title>
  <meta name="description" content="Proposta de homepage Mia & Paper em estilo caderno de recortes: colagem, fita-cola e polaroids.">
  <style>
    :root{
      --paper:#f2e9d4; --note:#fffdf3; --ink:#33302a; --muted:#7c7466;
      --red:#d8674f; --teal:#3f8f86; --mustard:#e0a63a; --plum:#8a5a7d;
      --tape:rgba(226,214,160,.7); --line:rgba(51,48,42,.16);
      --hand:"Segoe Print","Bradley Hand","Comic Sans MS","Marker Felt",cursive;
      --serif:"Georgia","Times New Roman",serif;
      --sans:"Segoe UI",system-ui,-apple-system,Arial,sans-serif;
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth;overflow-x:hidden}
    body{margin:0;color:var(--ink);font-family:var(--sans);line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden;
      background-color:var(--paper);
      background-image:
        linear-gradient(rgba(51,48,42,.05) 1px,transparent 1px),
        linear-gradient(90deg,rgba(51,48,42,.04) 1px,transparent 1px);
      background-size:26px 26px}
    body.menu-is-open{overflow:hidden}
    img{display:block;max-width:100%}
    a{color:inherit;text-decoration:none}
    button{font:inherit;color:inherit;cursor:pointer}
    h1,h2,h3,p,blockquote{margin:0}
    .wrap{width:min(100% - 30px,1080px);margin-inline:auto}
    .hand{font-family:var(--hand)}
    .tape{position:relative}
    .tape::before,.tape::after{content:"";position:absolute;width:66px;height:24px;background:var(--tape);
      box-shadow:0 2px 5px rgba(0,0,0,.12);z-index:3}
    .tape::before{top:-11px;left:14px;transform:rotate(-7deg)}
    .tape::after{top:-11px;right:14px;transform:rotate(6deg)}

    .head{position:sticky;top:0;z-index:40;background:rgba(242,233,212,.86);backdrop-filter:blur(10px);
      border-bottom:2px dashed var(--line);
      display:flex;align-items:center;justify-content:space-between;gap:10px;
      padding:11px max(15px,calc((100% - 1080px)/2))}
    .brand{display:inline-flex;align-items:center;gap:10px;font-family:var(--hand);font-size:1.3rem}
    .brand img{width:44px;height:44px;border-radius:50%;object-fit:cover;border:3px solid #fff;box-shadow:0 4px 10px rgba(0,0,0,.2);transform:rotate(-4deg)}
    .head-actions{display:flex;align-items:center;gap:8px}
    .cta-mini{display:inline-flex;align-items:center;min-height:44px;padding:0 16px;font-family:var(--hand);font-size:1rem;
      color:#fff;background:var(--red);border:2px solid var(--ink);border-radius:3px;transform:rotate(-1.5deg);box-shadow:2px 2px 0 var(--ink)}
    .burger{width:46px;height:46px;border:2px solid var(--ink);background:var(--note);border-radius:3px;display:grid;place-items:center;box-shadow:2px 2px 0 var(--ink)}
    .burger span,.burger span::before,.burger span::after{content:"";display:block;width:20px;height:2.5px;background:var(--ink)}
    .burger span{position:relative}
    .burger span::before{position:absolute;top:-6px}.burger span::after{position:absolute;top:6px}

    .backdrop{position:fixed;inset:0;z-index:45;background:rgba(51,48,42,.4);border:0;opacity:0;visibility:hidden;transition:.3s}
    body.menu-is-open .backdrop{opacity:1;visibility:visible}
    .menu{position:fixed;top:0;right:0;z-index:46;height:100%;width:min(85vw,320px);background:var(--note);
      border-left:3px solid var(--ink);padding:22px;transform:translateX(104%);transition:transform .3s ease;
      display:flex;flex-direction:column;gap:14px}
    body.menu-is-open .menu{transform:none}
    .menu-top{display:flex;align-items:center;justify-content:space-between}
    .menu-x{width:44px;height:44px;border:2px solid var(--ink);background:var(--paper);border-radius:3px;font-size:1.3rem}
    .menu nav{display:flex;flex-direction:column;gap:9px}
    .menu nav a{padding:12px 14px;border:2px solid var(--ink);border-radius:4px;font-family:var(--hand);font-size:1.15rem;background:var(--paper)}
    .menu nav a:nth-child(2n){transform:rotate(-1deg)}
    .menu nav a:nth-child(2n+1){transform:rotate(1deg)}
    .menu-note{margin-top:auto;font-size:.78rem;color:var(--muted)}

    section{padding-block:40px}
    .kicker{display:inline-block;font-family:var(--hand);font-size:1.15rem;color:var(--red);transform:rotate(-2deg)}
    .doodle{color:var(--teal)}

    .hero{padding-top:26px}
    .hero h1{font-family:var(--serif);font-weight:700;line-height:1.02;letter-spacing:-.01em;
      font-size:clamp(2.3rem,10vw,4rem);margin-top:10px}
    .hero h1 u{text-decoration:none;color:var(--red);background:linear-gradient(transparent 62%,var(--mustard) 62%)}
    .hero-lead{margin-top:16px;max-width:40ch;font-size:1.05rem;color:#4d4840}
    .hero-actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:22px}
    .btn{display:inline-flex;align-items:center;justify-content:center;min-height:52px;padding:0 24px;
      border:2px solid var(--ink);border-radius:4px;font-family:var(--hand);font-size:1.1rem;box-shadow:3px 3px 0 var(--ink);transition:.12s}
    .btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
    .btn-1{background:var(--teal);color:#fff}
    .btn-2{background:var(--note)}
    .polaroid{background:#fff;padding:12px 12px 44px;border:1px solid rgba(0,0,0,.08);box-shadow:0 16px 30px -18px rgba(0,0,0,.6);
      transform:rotate(-2.5deg);margin-top:30px;position:relative}
    .polaroid img{width:100%;aspect-ratio:5/4;object-fit:cover}
    .polaroid figcaption{position:absolute;left:0;right:0;bottom:12px;text-align:center;font-family:var(--hand);font-size:1.05rem;color:#5a544a}

    .sec-head{margin-bottom:22px}
    .sec-head h2{font-family:var(--serif);font-weight:700;line-height:1.08;font-size:clamp(1.7rem,6.5vw,2.7rem);margin-top:6px}
    .sec-head p{margin-top:10px;color:#4d4840;max-width:48ch}

    .stars{color:var(--mustard);letter-spacing:2px}
    .quotes{display:grid;gap:22px;margin-top:8px}
    .quote{background:var(--note);border:2px solid var(--ink);border-radius:5px;padding:20px;box-shadow:4px 4px 0 rgba(51,48,42,.18)}
    .quote:nth-child(1){transform:rotate(-1.4deg)}
    .quote:nth-child(2){transform:rotate(1deg)}
    .quote:nth-child(3){transform:rotate(-.6deg)}
    .quote blockquote{font-family:var(--serif);font-size:1.1rem;line-height:1.5;margin-top:8px}
    .quote footer{margin-top:14px;font-family:var(--hand);font-size:1rem;color:var(--plum)}

    .news{display:grid;gap:26px;margin-top:30px}
    .news-card{display:block;background:#fff;padding:12px 12px 18px;border:1px solid rgba(0,0,0,.08);
      box-shadow:0 18px 34px -20px rgba(0,0,0,.6)}
    .news-card:nth-child(1){transform:rotate(-1.2deg)}
    .news-card:nth-child(2){transform:rotate(1.2deg)}
    .news-card:active{transform:rotate(0)}
    .news-card img{width:100%;aspect-ratio:16/11;object-fit:cover}
    .news-label{display:inline-block;margin-top:14px;font-family:var(--hand);font-size:1rem;color:#fff;background:var(--plum);
      padding:3px 12px;border-radius:3px;transform:rotate(-1.5deg)}
    .news-card h3{font-family:var(--serif);font-weight:700;font-size:1.4rem;margin-top:10px}
    .news-card p{margin-top:8px;color:#4d4840;font-size:.95rem}
    .news-link{display:inline-block;margin-top:10px;font-family:var(--hand);font-size:1.05rem;color:var(--red)}

    .prods{display:grid;gap:16px;grid-template-columns:1fr 1fr;margin-top:28px}
    .prod{display:block;background:#fff;padding:9px 9px 12px;border:1px solid rgba(0,0,0,.08);box-shadow:0 12px 24px -16px rgba(0,0,0,.6)}
    .prod:nth-child(3n+1){transform:rotate(-2deg)}
    .prod:nth-child(3n+2){transform:rotate(1.6deg)}
    .prod:nth-child(3n+3){transform:rotate(-1deg)}
    .prod:active{transform:rotate(0)}
    .prod img{width:100%;aspect-ratio:1;object-fit:cover}
    .prod h3{font-family:var(--hand);font-size:1.2rem;margin-top:8px;text-align:center}
    .prod p{font-size:.78rem;color:var(--muted);text-align:center;margin-top:2px;line-height:1.35}

    .process{position:relative}
    .steps{display:grid;gap:18px;margin-top:26px}
    .step{background:var(--note);border:2px dashed var(--ink);border-radius:6px;padding:20px;position:relative}
    .step b{display:inline-grid;place-items:center;width:50px;height:50px;border-radius:50%;background:var(--mustard);
      border:2px solid var(--ink);font-family:var(--serif);font-weight:700;font-size:1.2rem;transform:rotate(-4deg)}
    .step small{display:block;font-family:var(--hand);font-size:1.05rem;color:var(--teal);margin-top:10px}
    .step h3{font-family:var(--serif);font-weight:700;font-size:1.25rem;margin-top:2px}
    .step p{margin-top:6px;color:#4d4840;font-size:.94rem}

    .final{text-align:center}
    .final-box{background:var(--red);color:#fff;border:2px solid var(--ink);border-radius:6px;padding:36px 22px;
      box-shadow:6px 6px 0 var(--ink);transform:rotate(-.6deg)}
    .final-box h2{font-family:var(--serif);font-weight:700;font-size:clamp(1.8rem,7vw,2.9rem);line-height:1.06}
    .final-box .btn{margin-top:20px;background:var(--note);color:var(--ink)}

    .foot{border-top:2px dashed var(--line);padding:34px 0 96px;text-align:center}
    .foot .brand{justify-content:center;margin-bottom:12px}
    .foot nav{display:flex;justify-content:center;flex-wrap:wrap;gap:16px}
    .foot nav a{font-family:var(--hand);font-size:1.05rem;color:var(--muted)}
    .foot p{font-size:.78rem;color:var(--muted);margin-top:10px}

    .mk-switcher{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:50;
      display:flex;gap:4px;max-width:calc(100% - 24px);overflow-x:auto;padding:5px;border-radius:6px;
      background:var(--note);border:2px solid var(--ink);box-shadow:3px 3px 0 var(--ink);scrollbar-width:none}
    .mk-switcher::-webkit-scrollbar{display:none}
    .mk-switcher a{flex:0 0 auto;min-width:32px;height:32px;display:grid;place-items:center;padding:0 8px;
      font-family:var(--hand);font-size:.92rem;color:var(--muted);border-radius:3px}
    .mk-switcher a[aria-current="page"]{background:var(--red);color:#fff}

    @media(min-width:720px){
      .quotes{grid-template-columns:repeat(3,1fr)}
      .news{grid-template-columns:1fr 1fr}
      .prods{grid-template-columns:repeat(4,1fr)}
      .steps{grid-template-columns:repeat(3,1fr)}
      .hero{display:grid;grid-template-columns:1.05fr .95fr;gap:34px;align-items:center}
      .polaroid{margin-top:0}
    }
  </style>
</head>
<body data-concept="recorte" data-mockup-page="9">
  <div id="app"></div>
  <script src="mockups-data.js?v=20260718"></script>
  <script>
  (function(){
    var M=window.MIA,e=M.esc,app=document.getElementById("app");
    var nav=M.nav.map(function(n){return '<a href="'+n.href+'">'+e(n.label)+'</a>';}).join("");

    var quotes=M.quotes.map(function(q){
      return '<figure class="quote"><span class="stars" aria-label="5 estrelas">★★★★★</span><blockquote>“'+e(q.text)+'”</blockquote><footer>— '+e(q.source)+'</footer></figure>';
    }).join("");

    var news=M.news.map(function(n){
      return '<a class="news-card" href="'+n.href+'"><img src="'+n.image+'" alt="'+e(n.alt)+'" loading="lazy">'+
        '<span class="news-label">'+e(n.label)+'</span><h3>'+e(n.title)+'</h3>'+
        '<p>'+e(n.text)+'</p><span class="news-link">'+e(n.cta)+' ✎</span></a>';
    }).join("");

    var prods=M.products.map(function(p){
      return '<a class="prod" href="'+p.href+'"><img src="'+p.image+'" alt="'+e(p.alt)+'" loading="lazy"><h3>'+e(p.name)+'</h3><p>'+e(p.text)+'</p></a>';
    }).join("");

    var steps=M.process.map(function(s){
      return '<article class="step"><b>'+s.n+'</b><small>'+e(s.key)+'</small><h3>'+e(s.title)+'</h3><p>'+e(s.text)+'</p></article>';
    }).join("");

    app.innerHTML=[
      '<header class="head">',
        '<a class="brand" href="index.html" aria-label="Ver todos os mockups"><img src="'+M.logo+'" alt="" width="92" height="92"><span>Mia &amp; Paper</span></a>',
        '<div class="head-actions"><a class="cta-mini" href="'+M.catalog+'">Catálogo</a>',
        '<button class="burger" type="button" aria-label="Abrir menu" aria-expanded="false" data-menu-button><span></span></button></div>',
      '</header>',

      '<button class="backdrop" type="button" aria-label="Fechar menu" data-menu-close></button>',
      '<aside class="menu" aria-label="Menu principal" aria-hidden="true" data-menu-panel>',
        '<div class="menu-top"><span class="brand"><img src="'+M.logo+'" alt="" width="92" height="92"><span>Mia &amp; Paper</span></span>',
        '<button class="menu-x" type="button" aria-label="Fechar menu" data-menu-close>×</button></div>',
        '<nav>'+nav+'<a href="'+M.catalog+'">Catálogo simples</a></nav>',
        '<p class="menu-note">Mockup visual isolado. A homepage real não foi alterada.</p>',
      '</aside>',

      '<main class="wrap">',
        '<section class="hero" id="inicio" aria-labelledby="h9-title">',
          '<div><span class="kicker">feito à mão, por ti ✎</span>',
            '<h1 id="h9-title">Colamos memórias em <u>papel</u> que fica.</h1>',
            '<p class="hero-lead">Cadernos, molduras e lembranças que juntas peça a peça — como um caderno de recortes que passa a ser teu.</p>',
            '<div class="hero-actions"><a class="btn btn-1" href="#produtos">Ver produtos</a><a class="btn btn-2" href="#novidades">Novidades</a></div>',
          '</div>',
          '<figure class="polaroid"><img src="'+M.hero.image+'" alt="'+e(M.hero.alt)+'" width="1000" height="800"><figcaption class="hand">o nosso preferido ♡</figcaption></figure>',
        '</section>',

        '<section id="testemunhos" aria-labelledby="t9-title">',
          '<div class="sec-head"><span class="kicker">recortes de quem recebeu</span><h2 id="t9-title">Peças que chegam e ficam.</h2><p>Textos provisórios, coladas aqui para avaliar o design.</p></div>',
          '<div class="quotes">'+quotes+'</div>',
        '</section>',

        '<section id="novidades" aria-labelledby="n9-title">',
          '<div class="sec-head"><span class="kicker">acabadinho de chegar</span><h2 id="n9-title">O que chegou ao atelier.</h2></div>',
          '<div class="news">'+news+'</div>',
        '</section>',

        '<section id="produtos" aria-labelledby="p9-title">',
          '<div class="sec-head"><span class="kicker">a nossa gavetinha</span><h2 id="p9-title">Começa pela categoria certa.</h2><p>Sete pontos de partida, cada um com as suas opções e materiais.</p></div>',
          '<div class="prods">'+prods+'</div>',
        '</section>',

        '<section class="process" id="como-encomendar" aria-labelledby="c9-title">',
          '<div class="sec-head"><span class="kicker">passo a passo</span><h2 id="c9-title">Do primeiro clique ao pedido final.</h2></div>',
          '<div class="steps">'+steps+'</div>',
        '</section>',

        '<section class="final"><div class="final-box"><h2>Já sabes o que procuras?</h2><a class="btn" href="'+M.catalog+'">Abrir catálogo ✎</a></div></section>',
      '</main>',

      '<footer class="foot"><div class="wrap"><span class="brand"><img src="'+M.logo+'" alt="" width="92" height="92"><span>Mia &amp; Paper</span></span>',
        '<nav><a href="'+M.base+'privacy.html">Privacidade</a><a href="'+M.base+'contacto.html">Contacto</a><a href="index.html">Todos os mockups</a></nav>',
        '<p>© Mia &amp; Paper 2026 · mockup visual</p></div></footer>',

      M.switcherHTML(9)
    ].join("");

    M.wireMenu();
  })();
  </script>
</body>
</html>

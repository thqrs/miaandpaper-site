<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#17130d">
  <title>Mockup 07 · Veludo Nocturno | Mia &amp; Paper</title>
  <meta name="description" content="Proposta de homepage Mia & Paper sóbria e elegante, em tons escuros com dourado.">
  <style>
    :root{
      --bg:#17130d; --bg-2:#1f1a12; --card:#221c13; --ink:#f2ead6; --muted:#a99b7d;
      --gold:#d7aa36; --gold-soft:#e7c675; --line:rgba(215,170,54,.22);
      --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
      --sans:"Segoe UI",system-ui,-apple-system,Helvetica,Arial,sans-serif;
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth;overflow-x:hidden}
    body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.6;
      -webkit-font-smoothing:antialiased;overflow-x:hidden}
    body.menu-is-open{overflow:hidden}
    img{display:block;max-width:100%}
    a{color:inherit;text-decoration:none}
    button{font:inherit;color:inherit;cursor:pointer}
    h1,h2,h3,p,blockquote{margin:0;font-weight:400}
    .wrap{width:min(100% - 40px,1120px);margin-inline:auto}
    .eyebrow{font-family:var(--sans);text-transform:uppercase;letter-spacing:.34em;font-size:.66rem;color:var(--gold)}

    .head{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--bg) 86%,transparent);
      backdrop-filter:blur(14px);border-bottom:1px solid var(--line);
      display:flex;align-items:center;justify-content:space-between;gap:10px;
      padding:14px max(20px,calc((100% - 1120px)/2))}
    .brand{display:inline-flex;align-items:center;gap:11px}
    .brand img{width:40px;height:40px;border-radius:50%;object-fit:cover;border:1px solid var(--line)}
    .brand span{font-family:var(--serif);font-size:1.18rem;letter-spacing:.03em}
    .head-actions{display:flex;align-items:center;gap:10px}
    .cta-mini{display:inline-flex;align-items:center;min-height:44px;padding:0 18px;border-radius:2px;
      border:1px solid var(--gold);color:var(--gold-soft);font-size:.78rem;letter-spacing:.12em;text-transform:uppercase}
    .burger{width:44px;height:44px;border-radius:2px;border:1px solid var(--line);background:transparent;display:grid;place-items:center}
    .burger span,.burger span::before,.burger span::after{content:"";display:block;width:18px;height:1px;background:var(--gold-soft)}
    .burger span{position:relative}
    .burger span::before{position:absolute;top:-6px}.burger span::after{position:absolute;top:6px}

    .backdrop{position:fixed;inset:0;z-index:45;background:rgba(0,0,0,.6);border:0;opacity:0;visibility:hidden;transition:.3s}
    body.menu-is-open .backdrop{opacity:1;visibility:visible}
    .menu{position:fixed;top:0;right:0;z-index:46;height:100%;width:min(84vw,320px);background:var(--bg-2);
      border-left:1px solid var(--line);padding:26px 24px;transform:translateX(103%);transition:transform .32s ease;
      display:flex;flex-direction:column;gap:16px}
    body.menu-is-open .menu{transform:none}
    .menu-top{display:flex;align-items:center;justify-content:space-between}
    .menu-x{width:44px;height:44px;border-radius:2px;border:1px solid var(--line);background:transparent;font-size:1.3rem;color:var(--gold-soft)}
    .menu nav{display:flex;flex-direction:column}
    .menu nav a{padding:15px 0;border-bottom:1px solid var(--line);font-family:var(--serif);font-size:1.28rem}
    .menu-note{margin-top:auto;font-size:.78rem;color:var(--muted);line-height:1.6}

    section{padding-block:58px;position:relative}
    .rule{width:44px;height:1px;background:var(--gold);opacity:.7}

    .hero{padding-top:48px}
    .hero-media{position:relative;margin-top:34px}
    .hero-media img{width:100%;aspect-ratio:4/5;object-fit:cover;border:1px solid var(--line)}
    .hero-media::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 40%,rgba(23,19,13,.85))}
    .hero-frame{position:absolute;inset:12px;border:1px solid rgba(231,198,117,.4);pointer-events:none;z-index:2}
    .hero-cap{position:absolute;left:22px;bottom:20px;z-index:3;font-family:var(--serif);font-style:italic;
      color:var(--gold-soft);font-size:.9rem;letter-spacing:.04em}
    .hero h1{font-family:var(--serif);font-weight:400;line-height:1.06;letter-spacing:.005em;
      font-size:clamp(2.4rem,10vw,4.6rem);margin-top:22px}
    .hero h1 em{font-style:italic;color:var(--gold-soft)}
    .hero-lead{margin-top:22px;max-width:46ch;color:#cabfa4;font-size:1.06rem}
    .hero-actions{display:flex;flex-wrap:wrap;gap:14px;margin-top:28px}
    .btn{display:inline-flex;align-items:center;justify-content:center;min-height:54px;padding:0 30px;
      font-size:.8rem;letter-spacing:.16em;text-transform:uppercase;transition:.2s}
    .btn-gold{background:var(--gold);color:#221c0e;font-weight:600}
    .btn-gold:active{background:var(--gold-soft)}
    .btn-line{border:1px solid var(--line);color:var(--gold-soft)}
    .btn-line:active{border-color:var(--gold)}

    .sec-head .eyebrow{display:block}
    .sec-head h2{font-family:var(--serif);font-weight:400;line-height:1.12;
      font-size:clamp(1.8rem,6.5vw,3rem);margin-top:14px;max-width:22ch}
    .sec-head p{margin-top:14px;color:#cabfa4;max-width:52ch}
    .sec-head .rule{margin-bottom:20px}

    .rating{display:flex;align-items:baseline;gap:12px;margin:26px 0 6px}
    .stars{color:var(--gold);letter-spacing:4px}
    .rating small{color:var(--muted);font-size:.8rem;letter-spacing:.1em;text-transform:uppercase}
    .quotes{display:grid;gap:1px;margin-top:20px;background:var(--line);border:1px solid var(--line)}
    .quote{background:var(--bg);padding:30px 26px}
    .quote span{font-family:var(--serif);font-style:italic;color:var(--gold);font-size:1.6rem}
    .quote blockquote{font-family:var(--serif);font-size:1.16rem;line-height:1.5;color:#e6dcc4;margin-top:8px}
    .quote footer{margin-top:18px;font-size:.7rem;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}

    .news{display:grid;gap:24px;margin-top:34px}
    .news-card{display:block;border:1px solid var(--line);background:var(--card);overflow:hidden;transition:.2s}
    .news-card:active{border-color:var(--gold)}
    .news-card img{width:100%;aspect-ratio:16/10;object-fit:cover}
    .news-body{padding:22px 22px 26px}
    .news-label{font-size:.66rem;letter-spacing:.22em;text-transform:uppercase;color:var(--gold)}
    .news-body h3{font-family:var(--serif);font-size:1.6rem;margin-top:10px}
    .news-body p{margin-top:10px;color:#cabfa4}
    .news-link{display:inline-block;margin-top:16px;font-size:.76rem;letter-spacing:.14em;text-transform:uppercase;
      color:var(--gold-soft);border-bottom:1px solid var(--gold)}

    .prods{display:grid;gap:1px;margin-top:34px;background:var(--line);border:1px solid var(--line)}
    .prod{display:flex;align-items:center;gap:18px;padding:16px 18px;background:var(--bg);transition:.2s}
    .prod:active{background:var(--bg-2)}
    .prod-num{font-family:var(--serif);font-size:.9rem;color:var(--gold);width:26px;flex:0 0 auto}
    .prod img{width:70px;height:70px;flex:0 0 auto;object-fit:cover;border:1px solid var(--line)}
    .prod-copy{flex:1;min-width:0}
    .prod-copy h3{font-family:var(--serif);font-size:1.28rem}
    .prod-copy p{font-size:.88rem;color:var(--muted)}
    .prod-arrow{color:var(--gold-soft)}

    .process{background:var(--bg-2);border-block:1px solid var(--line)}
    .steps{display:grid;gap:1px;margin-top:34px;background:var(--line);border:1px solid var(--line)}
    .step{background:var(--bg-2);padding:26px 22px}
    .step b{font-family:var(--serif);font-size:2.4rem;color:var(--gold)}
    .step small{display:block;text-transform:uppercase;letter-spacing:.18em;font-size:.64rem;color:var(--muted);margin-top:6px}
    .step h3{font-family:var(--serif);font-size:1.35rem;margin-top:10px}
    .step p{margin-top:8px;color:#cabfa4;font-size:.94rem}

    .final{text-align:center}
    .final .rule{margin:0 auto 20px}
    .final h2{font-family:var(--serif);font-weight:400;font-size:clamp(2rem,8vw,3.4rem);line-height:1.08}
    .final .btn{margin-top:28px}

    .foot{border-top:1px solid var(--line);padding:40px 0 96px}
    .foot .wrap{display:flex;flex-direction:column;gap:16px;align-items:center;text-align:center}
    .foot nav{display:flex;flex-wrap:wrap;justify-content:center;gap:20px}
    .foot nav a{font-size:.82rem;color:var(--muted);letter-spacing:.04em}
    .foot p{font-size:.76rem;color:var(--muted)}

    .mk-switcher{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:50;
      display:flex;gap:4px;max-width:calc(100% - 24px);overflow-x:auto;padding:5px;
      background:var(--bg-2);border:1px solid var(--line);box-shadow:0 14px 34px -14px #000;scrollbar-width:none}
    .mk-switcher::-webkit-scrollbar{display:none}
    .mk-switcher a{flex:0 0 auto;min-width:32px;height:32px;display:grid;place-items:center;padding:0 8px;
      font-size:.72rem;color:var(--muted);letter-spacing:.02em}
    .mk-switcher a[aria-current="page"]{background:var(--gold);color:#221c0e;font-weight:600}

    @media(min-width:720px){
      .quotes{grid-template-columns:repeat(3,1fr)}
      .news{grid-template-columns:1fr 1fr}
      .prods{grid-template-columns:1fr 1fr}
      .steps{grid-template-columns:repeat(3,1fr)}
      .hero{display:grid;grid-template-columns:1fr 1fr;gap:44px;align-items:center}
      .hero-media{margin-top:0;order:2}
    }
  </style>
</head>
<body data-concept="veludo" data-mockup-page="7">
  <div id="app"></div>
  <script src="mockups-data.js?v=20260718"></script>
  <script>
  (function(){
    var M=window.MIA,e=M.esc,app=document.getElementById("app");
    var nav=M.nav.map(function(n){return '<a href="'+n.href+'">'+e(n.label)+'</a>';}).join("");

    var quotes=M.quotes.map(function(q){
      return '<figure class="quote"><span aria-hidden="true">“</span><blockquote>'+e(q.text)+'”</blockquote><footer>'+e(q.source)+'</footer></figure>';
    }).join("");

    var news=M.news.map(function(n){
      return '<a class="news-card" href="'+n.href+'"><img src="'+n.image+'" alt="'+e(n.alt)+'" loading="lazy">'+
        '<span class="news-body"><span class="news-label">'+e(n.label)+'</span><h3>'+e(n.title)+'</h3>'+
        '<p>'+e(n.text)+'</p><span class="news-link">'+e(n.cta)+'</span></span></a>';
    }).join("");

    var prods=M.products.map(function(p,i){
      var num=(i+1<10?"0":"")+(i+1);
      return '<a class="prod" href="'+p.href+'"><span class="prod-num">'+num+'</span><img src="'+p.image+'" alt="'+e(p.alt)+'" loading="lazy">'+
        '<span class="prod-copy"><h3>'+e(p.name)+'</h3><p>'+e(p.text)+'</p></span>'+
        '<span class="prod-arrow" aria-hidden="true">→</span></a>';
    }).join("");

    var steps=M.process.map(function(s){
      return '<article class="step"><b>'+s.n+'</b><small>'+e(s.key)+'</small><h3>'+e(s.title)+'</h3><p>'+e(s.text)+'</p></article>';
    }).join("");

    app.innerHTML=[
      '<header class="head">',
        '<a class="brand" href="index.html" aria-label="Ver todos os mockups"><img src="'+M.logo+'" alt="" width="92" height="92"><span>Mia &amp; Paper</span></a>',
        '<div class="head-actions"><a class="cta-mini" href="'+M.catalog+'">Catálogo</a>',
        '<button class="burger" type="button" aria-label="Abrir menu" aria-expanded="false" data-menu-button><span></span></button></div>',
      '</header>',

      '<button class="backdrop" type="button" aria-label="Fechar menu" data-menu-close></button>',
      '<aside class="menu" aria-label="Menu principal" aria-hidden="true" data-menu-panel>',
        '<div class="menu-top"><span class="brand"><img src="'+M.logo+'" alt="" width="92" height="92"><span>Mia &amp; Paper</span></span>',
        '<button class="menu-x" type="button" aria-label="Fechar menu" data-menu-close>×</button></div>',
        '<nav>'+nav+'<a href="'+M.catalog+'">Catálogo simples</a></nav>',
        '<p class="menu-note">Mockup visual isolado. A homepage real não foi alterada.</p>',
      '</aside>',

      '<main class="wrap">',
        '<section class="hero" id="inicio" aria-labelledby="h7-title">',
          '<figure class="hero-media"><img src="'+M.hero.image+'" alt="'+e(M.hero.alt)+'" width="1200" height="1500"><span class="hero-frame"></span><figcaption class="hero-cap">Feito por encomenda · Portugal</figcaption></figure>',
          '<div><span class="eyebrow">Atelier de papel · desde a primeira ideia</span>',
            '<h1 id="h7-title">Objetos pessoais, <em>com o peso certo.</em></h1>',
            '<p class="hero-lead">Cadernos, molduras e lembranças preparados em pequena escala. Escolhes a base, afinamos contigo, e a peça nasce do teu pedido.</p>',
            '<div class="hero-actions"><a class="btn btn-gold" href="#produtos">Ver a coleção</a><a class="btn btn-line" href="#novidades">Novidades</a></div>',
          '</div>',
        '</section>',

        '<section id="testemunhos" aria-labelledby="t7-title">',
          '<div class="sec-head"><span class="rule"></span><span class="eyebrow">Testemunhos · textos provisórios</span><h2 id="t7-title">Peças que chegam e ficam.</h2></div>',
          '<div class="rating"><span class="stars" aria-label="5 estrelas">★★★★★</span><small>5 estrelas</small></div>',
          '<div class="quotes">'+quotes+'</div>',
        '</section>',

        '<section id="novidades" aria-labelledby="n7-title">',
          '<div class="sec-head"><span class="rule"></span><span class="eyebrow">Novidades</span><h2 id="n7-title">O que chegou ao atelier.</h2><p>Novos produtos e novas formas de personalizar o teu pedido.</p></div>',
          '<div class="news">'+news+'</div>',
        '</section>',

        '<section id="produtos" aria-labelledby="p7-title">',
          '<div class="sec-head"><span class="rule"></span><span class="eyebrow">Produtos · sete categorias</span><h2 id="p7-title">Começa pela categoria certa.</h2></div>',
          '<div class="prods">'+prods+'</div>',
        '</section>',
      '</main>',

      '<section class="process" id="como-encomendar" aria-labelledby="c7-title"><div class="wrap">',
        '<div class="sec-head"><span class="rule"></span><span class="eyebrow">Como encomendar</span><h2 id="c7-title">Três passos, sem pressa.</h2><p>O processo mantém-se curto e claro, mesmo quando há pormenores para escolher.</p></div>',
        '<div class="steps">'+steps+'</div>',
      '</div></section>',

      '<main class="wrap"><section class="final"><span class="rule"></span><h2>Já sabes o que procuras?</h2><a class="btn btn-gold" href="'+M.catalog+'">Abrir catálogo</a></section></main>',

      '<footer class="foot"><div class="wrap"><span class="brand"><img src="'+M.logo+'" alt="" width="92" height="92"><span>Mia &amp; Paper</span></span>',
        '<nav><a href="'+M.base+'privacy.html">Privacidade</a><a href="'+M.base+'contacto.html">Contacto</a><a href="index.html">Todos os mockups</a></nav>',
        '<p>© Mia &amp; Paper 2026 · mockup visual</p></div></footer>',

      M.switcherHTML(7)
    ].join("");

    M.wireMenu();
  })();
  </script>
</body>
</html>

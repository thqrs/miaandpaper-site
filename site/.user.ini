; Ficheiros de personalização: o limite real são 40 MB e quem o aplica é o
; upload-order-photo.php (ORDER_MEDIA_*_MAX_BYTES), porque só ele sabe explicar
; o motivo a quem está do outro lado.
;
; Estes valores ficam DE PROPÓSITO acima dos 40 MB: se fosse o PHP a cortar
; primeiro, o pedido morria antes do nosso código correr e a pessoa levava um
; erro cru, sem linha nenhuma em private/order-uploads/rejeicoes.log.
;
; post_max_size tem de ser maior que upload_max_filesize — leva o ficheiro mais
; o resto do formulário (kind, purpose, width, height) e a moldura multipart.
; Os ficheiros sobem um a um, por isso não precisa de contar com 10 de uma vez.
;
; O `php -S` do desenvolvimento IGNORA este ficheiro. Ver os -d em start-lan.bat.
upload_max_filesize = 44M
post_max_size = 48M
max_file_uploads = 10
max_input_time = 300
